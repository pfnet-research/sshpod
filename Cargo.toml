[package]
name = "sshpod"
version = "1.0.9"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "io-std", "time", "sync", "fs"] }
whoami = "1"
log = "0.4"
env_logger = "0.11"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

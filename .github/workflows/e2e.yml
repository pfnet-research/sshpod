name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sshpod
        run: cargo build --release --locked

      - name: Upload sshpod binary
        uses: actions/upload-artifact@v4
        with:
          name: sshpod-linux
          path: target/release/sshpod

  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:22.04
          - name: alpine
            image: alpine:3.19
          - name: busybox
            image: busybox:1.36
          - name: python
            image: python:3.12-slim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sshpod binary
        uses: actions/download-artifact@v4
        with:
          name: sshpod-linux
          path: /tmp/sshpod-bin

      - name: Make binary executable
        run: chmod +x /tmp/sshpod-bin/sshpod

      - name: Install sshpod for configure
        run: |
          mkdir -p ~/.local/bin
          cp /tmp/sshpod-bin/sshpod ~/.local/bin/sshpod

      - name: Configure sshpod
        run: ~/.local/bin/sshpod configure

      - name: Write kind config
        run: |
          cat >/tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              image: kindest/node:v1.30.0
          EOF

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sshpod-e2e-${{ matrix.name }}
          config: /tmp/kind-config.yaml

      - name: Launch test pod
        run: |
          set -euxo pipefail
          kubectl wait --for=condition=Ready node --all --timeout=180s
          POD_NAME="sshpod-e2e-${{ matrix.name }}"
          kubectl run "$POD_NAME" \
            --image="${{ matrix.image }}" \
            --restart=Never \
            --env='SSHPOD_TEST_LABEL=two words "quoted" #tag \ tail ' \
            --env=SSHPOD_TEST_EMPTY= \
            --env="$(printf 'SSHPOD_TEST_MULTILINE=first\nsecond')" \
            --command -- sh -c "while true; do sleep 3600; done"
          kubectl wait --for=condition=Ready "pod/$POD_NAME" --timeout=180s

      - name: Verify ssh works through sshpod
        env:
          SSHPOD_BIN: /tmp/sshpod-bin/sshpod
        shell: bash
        run: |
          set -euxo pipefail
          POD_NAME="sshpod-e2e-${{ matrix.name }}"
          KUBE_CONTEXT="$(kubectl config current-context)"
          HOST="root@pod--${POD_NAME}.namespace--default.context--${KUBE_CONTEXT}.sshpod"

          ssh "$HOST" 'echo ssh-ok' | tee /tmp/ssh_output
          grep 'ssh-ok' /tmp/ssh_output

          printf 'printf "shell-ok\\n"\nexit\n' |
            timeout 30s ssh -tt "$HOST" |
            tee /tmp/ssh_shell_output
          grep 'shell-ok' /tmp/ssh_shell_output

          ssh "$HOST" 'test -z "${SSHPOD_TEST_LABEL+x}${KUBERNETES_SERVICE_HOST+x}"'

          export SSHPOD_TEST_LABEL='client value'
          PROXY="$SSHPOD_BIN proxy --host %h --user %r --port %p"
          INHERIT="$PROXY --inherit-env SSHPOD_TEST_LABEL --inherit-env SSHPOD_TEST_EMPTY --inherit-env SSHPOD_TEST_MISSING"

          ssh -o "ProxyCommand=$INHERIT" "$HOST" \
            'test "${SSHPOD_TEST_EMPTY+x}" = x && test -z "$SSHPOD_TEST_EMPTY" && test -z "${SSHPOD_TEST_MISSING+x}"'
          test "$(ssh -o "ProxyCommand=$INHERIT" "$HOST" 'printf "%s" "$SSHPOD_TEST_LABEL"')" = \
            'two words "quoted" #tag \ tail '

          printf 'printf "\\nenvironment=%%s\\n" "$SSHPOD_TEST_LABEL"\nexit\n' |
            timeout 30s ssh -tt -o "ProxyCommand=$INHERIT" "$HOST" |
            tr -d '\r' |
            grep -Fx 'environment=two words "quoted" #tag \ tail '

          ssh -o "ProxyCommand=$PROXY --inherit-env SSHPOD_TEST_EMPTY" "$HOST" \
            'test "${SSHPOD_TEST_EMPTY+x}" = x && test -z "${SSHPOD_TEST_LABEL+x}"'
          ssh "$HOST" 'test -z "${SSHPOD_TEST_LABEL+x}${SSHPOD_TEST_EMPTY+x}"'

          if ssh -o "ProxyCommand=$PROXY --inherit-env HOME" "$HOST" true >/tmp/ssh_env_error 2>&1; then
            echo 'HOME was accepted as an inherited variable' >&2
            exit 1
          fi
          grep -F 'HOME is reserved' /tmp/ssh_env_error


          if ssh -o "ProxyCommand=$PROXY --inherit-env SSHPOD_TEST_MULTILINE" "$HOST" true >/tmp/ssh_env_error 2>&1; then
            echo 'A multiline environment value was accepted' >&2
            exit 1
          fi
          grep -F 'multiline values are not supported' /tmp/ssh_env_error

          printf 'pwd\n' | sftp -b - -o "ProxyCommand=$INHERIT" "$HOST" | grep -F 'Remote working directory'

name: Release

# Cargo.toml is the single source of the version. Every run builds and checks the
# five release archives; a manual run on main also tags that commit and publishes them.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "sshpod") | .version')"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unsupported version in Cargo.toml: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check that this version can be released
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main, not $GITHUB_REF."
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$existing" ]; then
            echo "::error::Tag $TAG already exists. Bump the version in Cargo.toml and Cargo.lock before releasing."
            exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch_name: linux_amd64
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            arch_name: linux_arm64
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_name: darwin_arm64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_name: windows_amd64
            ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch_name: windows_arm64
            ext: zip
    needs: plan
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Read by build.rs; cross forwards it into its container (Cross.toml).
      SSHPOD_BUILD_COMMIT: ${{ github.sha }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release (Linux musl)
        if: runner.os == 'Linux'
        run: |
          cross build --release --locked --target ${{ matrix.target }}

      - name: Build release
        if: runner.os != 'Linux'
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux binary is fully static
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          BIN="target/${{ matrix.target }}/release/sshpod"
          readelf -d "$BIN" > dynamic-deps.txt
          ! grep -F "Shared library:" dynamic-deps.txt
          readelf -l "$BIN" > program-headers.txt
          ! grep -F "Requesting program interpreter" program-headers.txt

      - name: Verify dynamic dependencies (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          BIN="target/${{ matrix.target }}/release/sshpod"
          chmod +x ./scripts/check-dynamic-deps.sh
          ./scripts/check-dynamic-deps.sh "$BIN"

      - name: Package (unix)
        if: runner.os != 'Windows'
        id: package_unix
        shell: bash
        run: |
          set -euxo pipefail
          BIN_NAME="sshpod"
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          ARTIFACT_DIR=artifact
          mkdir -p "$ARTIFACT_DIR"
          cp "$BIN" "$ARTIFACT_DIR/"
          ASSET="sshpod_${VERSION}_${{ matrix.arch_name }}.${{ matrix.ext }}"
          (cd "$ARTIFACT_DIR" && tar czf "../$ASSET" .)
          echo "asset_path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Package (windows)
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $BinName = "sshpod"
          $Bin = "target/${{ matrix.target }}/release/${BinName}.exe"
          $ArtifactDir = "artifact"
          New-Item -ItemType Directory -Force -Path $ArtifactDir | Out-Null
          Copy-Item $Bin -Destination $ArtifactDir
          $Asset = "sshpod_${env:VERSION}_${{ matrix.arch_name }}.${{ matrix.ext }}"
          Compress-Archive -Path "$ArtifactDir\*" -DestinationPath $Asset -Force
          "asset_path=$Asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_unix.outputs.asset_path || steps.package_windows.outputs.asset_path }}
          path: ${{ steps.package_unix.outputs.asset_path || steps.package_windows.outputs.asset_path }}

  verify:
    needs:
      - plan
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_name: linux_amd64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            arch_name: linux_arm64
            ext: tar.gz
          - os: macos-latest
            arch_name: darwin_arm64
            ext: tar.gz
          - os: windows-latest
            arch_name: windows_amd64
            ext: zip
          - os: windows-11-arm
            arch_name: windows_arm64
            ext: zip
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ASSET: sshpod_${{ needs.plan.outputs.version }}_${{ matrix.arch_name }}.${{ matrix.ext }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ASSET }}

      - name: Verify packaged version (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir extracted
          tar xzf "$ASSET" -C extracted
          actual="$(./extracted/sshpod --version)"
          test "$actual" = "sshpod $VERSION (${GITHUB_SHA:0:7})"

      - name: Verify packaged version (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path $env:ASSET -DestinationPath extracted
          $actual = (& ./extracted/sshpod.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "sshpod.exe --version failed" }
          $expected = "sshpod $($env:VERSION) ($($env:GITHUB_SHA.Substring(0, 7)))"
          if ($actual -ne $expected) {
            throw "Expected '$expected' but got '$actual'"
          }

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - plan
      - build
      - verify
    runs-on: ubuntu-latest
    concurrency: release-publish
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sshpod_*
          path: dist
          merge-multiple: true

      - name: Check assets and write checksums
        working-directory: dist
        run: |
          set -euxo pipefail
          assets=(
            "sshpod_${VERSION}_darwin_arm64.tar.gz"
            "sshpod_${VERSION}_linux_amd64.tar.gz"
            "sshpod_${VERSION}_linux_arm64.tar.gz"
            "sshpod_${VERSION}_windows_amd64.zip"
            "sshpod_${VERSION}_windows_arm64.zip"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          test "$(find . -type f | wc -l)" -eq "${#assets[@]}"
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The tag is created here, on the commit that was built, only after every
      # archive has been built and checked.
      - name: Publish release
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG")"
          if [ -n "$existing" ]; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "sshpod $VERSION" \
            --generate-notes \
            --latest \
            dist/*
          tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG points at $tagged, but $GITHUB_SHA was built."
            exit 1
          fi
